# SIRA — entorno de desarrollo/demo local.
#   docker compose up -d postgres minio           # núcleo operativo (001-008/011/012)
#   docker compose --profile data up -d           # + warehouse ELT (010): clickhouse + airflow
#
# Principio III (Separación de Motores): postgres = operativo + control del
# pipeline; minio landing-zone = raw del Extract; clickhouse = warehouse OLAP;
# airflow = orquestación ELT. Todas las credenciales de estos servicios son
# locales de desarrollo (como JWT_SECRET / MinIO), no de un tercero.

services:
  postgres:
    image: postgres:16
    container_name: sira-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sira}
      POSTGRES_DB: ${POSTGRES_DB:-sira}
    ports:
      - "15432:5432"
    volumes:
      - sira_pgdata:/var/lib/postgresql/data
      # El esquema de `sira` NO se aplica aquí: lo aplica Alembic (`alembic upgrade
      # head`, migración 0001) como fuente única. Este init sólo crea la base
      # `airflow` (metadata de Airflow, feature 010) y sólo corre en un volumen nuevo.
      - ./data_platform/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sira} -d ${POSTGRES_DB:-sira}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sira-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sira_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea los buckets de esta feature al arrancar (Principio III: uno por responsabilidad).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/producto-imagenes &&
      mc mb --ignore-existing local/comprobantes-venta &&
      mc mb --ignore-existing local/landing-zone &&
      echo 'buckets listos';
      "

  # ---------------------------------------------------------------------------
  # Warehouse ELT (feature 010) — perfil `data`, no arranca por defecto.
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: sira-clickhouse
    profiles: ["data"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-sira}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-sira}
      CLICKHOUSE_DB: sira_warehouse
    ports:
      - "8123:8123"   # HTTP (clickhouse-connect)
      - "9010:9000"   # native
    volumes:
      - sira_chdata:/var/lib/clickhouse
      # DDL de fact_venta + dimensiones — se aplica al primer arranque.
      - ./data_platform/clickhouse/schema_warehouse.sql:/docker-entrypoint-initdb.d/schema_warehouse.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: sira-airflow
    profiles: ["data"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Airflow lleva su propia metadata en una base APARTE (`airflow`) — nunca en
      # la base operativa `sira`: comparten servidor pero no tabla `alembic_version`.
      # La base se crea sola en un volumen nuevo (data_platform/postgres-init/);
      # en un volumen ya existente: `docker compose exec postgres createdb -U sira airflow`.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sira}:${POSTGRES_PASSWORD:-sira}@postgres:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Airflow 2.9 fija SQLAlchemy 1.4.x (no tocar) — ya trae `sqlalchemy.ext.asyncio`,
      # que es lo que usa dags_utils/. Sólo se agregan los drivers que no vienen.
      _PIP_ADDITIONAL_REQUIREMENTS: "clickhouse-connect>=0.7 minio>=7.2 asyncpg>=0.30"
      # Origen operativo + destinos que consumen los DAGs (dags_utils/*).
      SIRA_PG_DSN: postgresql://${POSTGRES_USER:-sira}:${POSTGRES_PASSWORD:-sira}@postgres:5432/${POSTGRES_DB:-sira}
      SIRA_CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-sira}:${CLICKHOUSE_PASSWORD:-sira}@clickhouse:8123/sira_warehouse
      SIRA_MINIO_ENDPOINT: minio:9000
      SIRA_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      SIRA_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "8080:8080"
    volumes:
      - ./data_platform/dags:/opt/airflow/dags
      - sira_airflowlogs:/opt/airflow/logs
    # `airflow standalone` genera una contraseña aleatoria en el PRIMER arranque.
    # Este wrapper fija admin/admin de forma determinista antes de arrancar; en
    # arranques siguientes el usuario ya existe y se le re-fija la contraseña.
    #   Login dev: admin / admin  ·  http://localhost:8080
    command: ["bash", "-c", "airflow db migrate; airflow users create -r Admin -u admin -p admin -e admin@sira.local -f Admin -l User || airflow users reset-password -u admin -p admin; exec airflow standalone"]

volumes:
  sira_pgdata:
  sira_miniodata:
  sira_chdata:
  sira_airflowlogs:
