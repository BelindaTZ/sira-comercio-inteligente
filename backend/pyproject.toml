[project]
name = "sira-backend"
version = "0.1.0"
description = "SIRA — Core de Ventas e Inventario (API REST FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "stripe>=11.0",
    "reportlab>=4.2",
    "sendgrid>=6.11",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "minio>=7.2",
    "apscheduler>=3.10",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- T004: linting / formatting ---
# Convención: `black` formatea, `ruff` sólo lintea (no se usa `ruff format`).
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI usa llamadas en defaults (Depends/Query) a propósito

[tool.ruff.lint.per-file-ignores]
# Las migraciones llevan DDL SQL en cadenas triple-quote; envolverlo lo hace menos legible.
"alembic/versions/*.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
