# Alembic — migraciones incrementales sobre 01_operativo_postgres.sql (T007).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url se toma de src.core.config en alembic/env.py (no se hardcodea aquí).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
